<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <img src="./img/111.png" alt="" id="image">

    <script>
        let image = document.getElementById('image');

        window.addEventListener('click', function (event) {
            // 獲取點擊位置的座標
            var x = event.clientX - window.getBoundingClientRect().left;
            var y = event.clientY - window.getBoundingClientRect().top;

            // 顯示座標
            console.log(x);
            console.log(y);

        });
    </script>
</body>

</html>
